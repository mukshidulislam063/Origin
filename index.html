<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Origin - Step 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f4;
    }
    h1 { text-align: center; }
    .axis-labels {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
    }
    .axis-labels input {
      padding: 5px;
      font-size: 14px;
    }
    .table-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    table {
      border-collapse: collapse;
      margin: 10px 0;
      width: 60%;
      max-height: 400px;
      overflow-y: scroll;
      display: block;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 5px;
      text-align: center;
    }
    th {
      background: #ddd;
    }
    .add-btn {
      margin-top: 10px;
      padding: 8px 15px;
      font-size: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .add-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Web Origin - Data Input</h1>

  <!-- Axis Labels -->
  <div class="axis-labels">
    <label>X Axis: <input type="text" id="xLabel" placeholder="e.g. Voltage"></label>
    <label>Y Axis: <input type="text" id="yLabel" placeholder="e.g. Current"></label>
  </div>

  <!-- Data Table -->
  <div class="table-container" id="tables">
    <table>
      <thead>
        <tr>
          <th>X</th>
          <th>Y</th>
        </tr>
      </thead>
      <tbody>
        <!-- Generate 2000 rows -->
        <script>
          for (let i = 0; i < 2000; i++) {
            document.write("<tr><td contenteditable='true'></td><td contenteditable='true'></td></tr>");
          }
        </script>
      </tbody>
    </table>
  </div>

  <!-- Add More Tables -->
  <div style="text-align:center;">
    <button class="add-btn" onclick="addTable()">+ Add Table</button>
  </div>

  <script>
    function addTable() {
      let container = document.getElementById("tables");
      let newTable = document.createElement("table");
      newTable.innerHTML = `
        <thead>
          <tr><th>X</th><th>Y</th></tr>
        </thead>
        <tbody>
          ${"<tr><td contenteditable='true'></td><td contenteditable='true'></td></tr>".repeat(2000)}
        </tbody>
      `;
      container.appendChild(newTable);
    }
  </script>

</body>
</html>
