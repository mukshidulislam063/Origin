<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph Builder - Data Input</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Theme switch button -->
  <button id="themeToggle" class="theme-btn">🌙</button>

  <h1>Graph Builder</h1>

  <!-- Container for all tables -->
  <div id="tablesContainer" class="tables-container">
    <div class="data-table">
      <label>X-axis Label:</label>
      <input type="text" class="xLabel" placeholder="e.g. Voltage"><br>
      <label>Y-axis Label:</label>
      <input type="text" class="yLabel" placeholder="e.g. Current"><br><br>

      <table class="inputTable">
        <tr>
          <th>X-axis Data</th>
        </tr>
        <tr>
          <td contenteditable="true" class="xData">Paste up to 2000 values here (space or enter separated)</td>
        </tr>
        <tr>
          <th>Y-axis Data</th>
        </tr>
        <tr>
          <td contenteditable="true" class="yData">Paste up to 2000 values here (space or enter separated)</td>
        </tr>
      </table>
    </div>
  </div>

  <!-- Add new table button -->
  <div style="text-align:center;margin:15px;">
    <button id="addTable">➕ Add Another Dataset</button>
  </div>

  <!-- Graph Options -->
  <div class="graph-options">
    <h2>Graph Options</h2>

    <label>Select Graph Type:</label><br>
    <select id="graphType">
      <option value="line">Line</option>
      <option value="dot">Dot</option>
      <option value="bar">Bar</option>
    </select><br><br>

    <label>Show Point Numbers:</label><br>
    <select id="showPoints">
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select><br><br>

    <label>Bar Type (if Bar selected):</label><br>
    <select id="barType">
      <option value="count">Point Numbers</option>
      <option value="percent">Percentage</option>
    </select><br><br>

    <label>Select Dimension:</label><br>
    <select id="dimension">
      <option value="2d">2D</option>
      <option value="3d">3D</option>
    </select><br><br>

    <label>Graph Color:</label><br>
    <input type="color" id="graphColor" value="#ff0000"><br><br>

    <label>Graph Background:</label><br>
    <select id="graphBg">
      <option value="plain">Plain</option>
      <option value="grid">Grid</option>
    </select><br><br>

    <label>Graph Background Color:</label><br>
    <select id="graphBgColor">
      <option value="white">White</option>
      <option value="black">Black</option>
      <option value="red">Red</option>
      <option value="blue">Blue</option>
      <option value="orange">Orange</option>
      <option value="green">Green</option>
    </select><br><br>
  </div>

  <!-- Submit Button -->
  <div style="text-align:center;margin:20px;">
    <button id="submitBtn">Submit</button>
  </div>

  <script src="app.js"></script>
</body>
  </html>
